<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Diagram: two foundations, state and interaction, carry four agent pillars: nervous system, skill marketplace, agents, cockpit">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#fbf3e4"/><stop offset="55%" stop-color="#f6ead4"/>
  <stop offset="100%" stop-color="#f1e0c3"/>
</linearGradient>
