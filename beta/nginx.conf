server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json;
    gzip_min_length 1000;

    # Cache static assets (CSS, JS, images)
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # bumbleflies personality headers
    add_header X-Powered-By "bumbleflies and caffeine";
    add_header X-Bumbleflies-Team "3 humans, 0 actual bees";
    add_header X-Bumbleflies-Status "buzzing";

    # Well-known files: correct content types + CORS for agent discovery
    location = /.well-known/agent-card.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/security.txt {
        default_type text/plain;
    }

    # Machine-readable files: CORS for cross-origin agent access
    location = /facts.json {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # SPA routing: Serve index.html for non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
    }
}
