# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'beta/package-lock.json'

      - name: Install
        working-directory: beta
        run: npm ci

      - name: Run tests
        working-directory: beta
        run: npm test
