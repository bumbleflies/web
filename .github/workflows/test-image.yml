# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Test Docker Image

on:
  workflow_call:
    inputs:
      run-health-check:
        description: 'Run the image health check. Set false for changes that cannot affect the image.'
        type: boolean
        required: false
        default: true

env:
  IMAGE_NAME: bumblecode/web

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Steps are gated rather than the job: this job's context
      # (`Docker Image Health Check / test`) is a required status check, so it
      # has to report on every PR, including ones that skip the image build.
      - name: Download image artifact
        if: inputs.run-health-check
        uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        if: inputs.run-health-check
        run: docker load --input /tmp/image.tar

      - name: Test health
        if: inputs.run-health-check
        run: |
          echo "Starting container..."
          docker run --rm --detach --name test_container \
            -p 8080:80 \
            docker.io/${{ env.IMAGE_NAME }}:www

          echo "Checking health status..."
          for i in {1..10}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' test_container 2>/dev/null || echo "none")
            echo "Attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              echo "✅ Container is healthy"
              break
            fi
            [ $i -lt 10 ] && sleep 6
          done

          final_status=$(docker inspect --format='{{.State.Health.Status}}' test_container 2>/dev/null || echo "none")
          if [ "$final_status" != "healthy" ]; then
            echo "❌ Container unhealthy"
            docker logs test_container || true
            docker stop test_container || true
            exit 1
          fi

      - name: Test endpoints
        if: inputs.run-health-check
        run: |
          echo "Testing endpoints..."

          for page in "" about services why-we; do
            url="http://localhost:8080${page:+/$page}"
            if curl -sf "$url" > /dev/null; then
              echo "✅ $url"
            else
              echo "❌ $url"
              exit 1
            fi
          done

          for page in about services why-we; do
            if curl -sf "http://localhost:8080/en/$page" > /dev/null; then
              echo "✅ /en/$page"
            else
              echo "❌ /en/$page"
              exit 1
            fi
          done

      - name: Cleanup
        if: always() && inputs.run-health-check
        run: docker stop test_container 2>/dev/null || true
