# This workflow builds the Astro site as a Docker image for production.
# It runs on the master branch and pushes the 'www' tag to the registry.
name: Build Astro Production Image

on:
  push:
    branches:
      - master
    paths:
      - beta/**
      - .github/workflows/build-www.yml
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: bumblecode/web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=www

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: beta
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
