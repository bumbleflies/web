# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI/CD Pipeline (Simple)

on:
  push:
    branches:
      - master
    paths:
      - 'beta/**'
  pull_request:
    branches:
      - '*'
    paths:
      - 'beta/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'beta/package-lock.json'
      - run: npm ci
        working-directory: beta
      - run: npx astro check
        working-directory: beta

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'beta/package-lock.json'
      - run: npm ci
        working-directory: beta
      - run: npm test
        working-directory: beta
