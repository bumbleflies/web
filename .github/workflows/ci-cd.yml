# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: 🔄 CI/CD Pipeline

on:
  push:
    branches:
      - master
    paths:
      - 'beta/**'
      - '.github/workflows/ci-cd.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'beta/**'

permissions:
  contents: read
  pages: write
  id-token: write

env:
  REGISTRY: docker.io
  IMAGE_NAME: bumblecode/web
  NODE_VERSION: '24'

jobs:
  # Step 1: Lint and Type Check
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'beta/package-lock.json'

      - name: 📥 Install dependencies
        working-directory: beta
        run: npm ci

      - name: 🔍 Type check with Astro
        working-directory: beta
        run: npx astro check

  # Step 2: Unit & Integration Tests
  test:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'beta/package-lock.json'

      - name: 📥 Install dependencies
        working-directory: beta
        run: npm ci

      - name: 🧪 Run unit tests
        working-directory: beta
        run: npm test

  # Step 3: Build Docker Image
  build-image:
    name: 🐳 Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 📊 Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=www
            type=sha,format=short

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: beta
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 4: Test Docker Image
  test-image:
    name: 🐳🧪 Test Docker Image
    runs-on: ubuntu-latest
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: 🐳 Pull Docker image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:www

      - name: 🧪 Test Docker image health
        run: |
          echo "Starting container..."
          docker run --rm --detach --name test_container \
            -p 8080:80 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:www

          echo "Checking health status..."
          for i in {1..10}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' test_container 2>/dev/null || echo "none")
            echo "Attempt $i: Health status = $status"

            if [ "$status" = "healthy" ]; then
              echo "✅ Container is healthy!"
              break
            fi

            if [ $i -lt 10 ]; then
              sleep 6
            fi
          done

          # Check final status
          final_status=$(docker inspect --format='{{.State.Health.Status}}' test_container 2>/dev/null || echo "none")
          if [ "$final_status" != "healthy" ]; then
            echo "❌ Container did not become healthy."
            docker logs test_container || true
            docker stop test_container || true
            exit 1
          fi

      - name: 🌐 Test HTTP endpoints
        run: |
          echo "Testing HTTP endpoints..."

          # Test homepage
          if curl -s -f http://localhost:8080/ > /dev/null; then
            echo "✅ Homepage (/) is accessible"
          else
            echo "❌ Homepage (/) not accessible"
            exit 1
          fi

          # Test German pages
          for page in about services why-we; do
            if curl -s -f http://localhost:8080/$page > /dev/null; then
              echo "✅ /$page page is accessible"
            else
              echo "❌ /$page page not accessible"
              exit 1
            fi
          done

          # Test English pages
          for page in about services why-we; do
            if curl -s -f http://localhost:8080/en/$page > /dev/null; then
              echo "✅ /en/$page page is accessible"
            else
              echo "❌ /en/$page page not accessible"
              exit 1
            fi
          done

          echo "✅ All endpoint tests passed"

      - name: 🧹 Cleanup
        if: always()
        run: |
          docker stop test_container 2>/dev/null || true
          docker rm test_container 2>/dev/null || true

  # Step 5: Deploy (only on successful test of master)
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: test-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    environment:
      name: production
      url: https://bumbleflies.de
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🎉 Create deployment tag
        run: |
          git tag -a deploy-$(date +%s) -m "Deployed from CI/CD pipeline"
          git push origin --tags || true

      - name: 📤 Trigger webhook deployment
        if: secrets.WEBSITE_HOOK_URL != null
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST ${{ secrets.WEBSITE_HOOK_URL }}/${{ secrets.WEBSITE_HOOK_SECRET }})
          if [ "$response" -ne 200 ]; then
            echo "⚠️  Deployment webhook returned $response (may not be critical)"
          else
            echo "✅ Deployment webhook triggered successfully"
          fi

      - name: ✅ Deployment complete
        run: |
          echo "🎉 Docker image bumblecode/web:www has been deployed to production"
          echo "🌍 Check https://bumbleflies.de"
