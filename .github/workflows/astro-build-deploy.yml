# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Astro Build & Deploy

on:
  push:
    branches:
      - master
    paths:
      - 'beta/**'
      - '.github/workflows/astro-build-deploy.yml'
      - '.github/workflows/part_*.yml'
  pull_request:
    branches:
      - '*'
    paths:
      - 'beta/**'
      - '.github/workflows/astro-build-deploy.yml'
  workflow_dispatch:

concurrency:
  group: "astro-deploy"
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker Image
    uses: ./.github/workflows/build.yml
    secrets: inherit

  test-unit:
    name: Unit Tests
    uses: ./.github/workflows/test.yml

  test-image:
    name: Docker Image Health Check
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/test-image.yml
    secrets: inherit

  deploy-stage:
    name: Deploy to Staging
    needs: test-unit
    if: always()
    secrets: inherit
    uses: ./.github/workflows/part_deploy_stage.yml

  deploy-live:
    name: Deploy to Production
    needs: [build, test-unit, test-image]
    if: github.ref == 'refs/heads/master' && success()
    secrets: inherit
    uses: ./.github/workflows/part_deploy_live.yml
