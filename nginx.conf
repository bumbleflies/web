server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and proxies over http on port 80, so nginx cannot
    # know the public scheme. Relative Location headers (instead of
    # "http://bumbleflies.de/...") avoid a needless https -> http -> https hop.
    absolute_redirect off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1000;

    # bumbleflies personality headers
    add_header X-Powered-By "bumbleflies and caffeine";
    add_header X-Bumbleflies-Team "3 humans, 0 actual bees";
    add_header X-Bumbleflies-Status "buzzing";

    # HTML: the URL is stable, the bytes are not — always revalidate.
    # (add_header does not inherit: a location that sets one drops the rest.)
    location ~* \.html$ {
        add_header Cache-Control "max-age=0, must-revalidate";
        add_header X-Powered-By "bumbleflies and caffeine";
        add_header X-Bumbleflies-Team "3 humans, 0 actual bees";
        add_header X-Bumbleflies-Status "buzzing";
    }

    # Astro build output: content hash in the filename -> safe to pin forever.
    location ^~ /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fonts: stable path, byte-identical across releases. One year — if a face
    # ever changes, give it a new filename (do not rely on revalidation).
    location ^~ /fonts/ {
        add_header Cache-Control "public, max-age=31536000";
    }

    # Unhashed assets (public/images, favicon): the path stays the
    # same when the file changes, so never more than a week and never immutable.
    location ~* \.(css|js|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf|otf|eot|mp3|wav)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Well-known files: correct content types + CORS for agent discovery
    location = /.well-known/agent-card.json {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    # Agent Resource Discovery: canonical path plus the predecessor path that
    # consumers (and Lighthouse's agentic-browsing audit) may still consult.
    location ~ ^/\.well-known/(ard|ai-catalog)\.json$ {
        default_type application/json;
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /.well-known/security.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600";
    }

    # Machine-readable files: CORS for cross-origin agent access
    location = /facts.json {
        add_header Access-Control-Allow-Origin "*";
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    location = /llms-full.txt {
        add_header Cache-Control "public, max-age=3600";
    }

    # robots.txt, sitemap-index.xml, sitemap-0.xml, rss.xml
    location ~ ^/(robots\.txt|sitemap[^/]*\.xml|rss\.xml)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Static site routing: serve the file, or the directory index (which
    # redirects to the trailing-slash URL), or a real 404. No SPA fallback:
    # "try_files ... /index.html" answered every unknown URL with 200 + homepage.
    location / {
        try_files $uri $uri/ =404;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }
}

# www is a duplicate of the apex host, not a second site.
# Traefik routes both hostnames to this container and forwards the Host header.
server {
    listen 80;
    listen [::]:80;
    server_name www.bumbleflies.de;

    return 301 https://bumbleflies.de$request_uri;
}
